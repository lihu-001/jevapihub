services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jev_hub}
      POSTGRES_USER: ${POSTGRES_USER:-jev_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jev_hub}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jev_hub}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "scripts/migrate.mjs"]
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-jev_hub}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jev_hub}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL is required}
      APP_URL: ${APP_URL:-http://localhost:3000}
      RUNTIME_MAX_BODY_BYTES: ${RUNTIME_MAX_BODY_BYTES:-1048576}
      RUNTIME_MAX_QUESTIONS: ${RUNTIME_MAX_QUESTIONS:-50}
      RUNTIME_RATE_LIMIT_GUEST: ${RUNTIME_RATE_LIMIT_GUEST:-60}
      RUNTIME_RATE_LIMIT_USER: ${RUNTIME_RATE_LIMIT_USER:-120}
      AI_BUILDER_ENABLED: ${AI_BUILDER_ENABLED:-false}
      AI_BUILDER_API_KEY: ${AI_BUILDER_API_KEY:-}
      AI_BUILDER_MODEL: ${AI_BUILDER_MODEL:-gpt-4.1-mini}
      AI_BUILDER_DAILY_LIMIT: ${AI_BUILDER_DAILY_LIMIT:-10}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
