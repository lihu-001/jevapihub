services:
  db-credentials:
    build: .
    user: "0"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - db_credentials:/run/jev-hub-db
    command: ["node", "scripts/compose-db.mjs", "init"]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jev_hub}
      POSTGRES_USER: ${POSTGRES_USER:-jev_hub}
      POSTGRES_PASSWORD_FILE: /run/jev-hub-db/password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - db_credentials:/run/jev-hub-db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s

    depends_on:
      db-credentials:
        condition: service_completed_successfully
  migrate:
    build: .
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jev_hub}
      POSTGRES_USER: ${POSTGRES_USER:-jev_hub}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - db_credentials:/run/jev-hub-db:ro
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-ec", "export DATABASE_URL=$$(node scripts/compose-db.mjs url); exec node scripts/migrate.mjs"]

  app:
    build: .
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jev_hub}
      POSTGRES_USER: ${POSTGRES_USER:-jev_hub}
    volumes:
      - db_credentials:/run/jev-hub-db:ro
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    command: ["sh", "-ec", "export DATABASE_URL=$$(node scripts/compose-db.mjs url); exec node node_modules/next/dist/bin/next start -H 0.0.0.0"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  db_credentials:
